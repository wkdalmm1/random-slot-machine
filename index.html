<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커스텀 랜덤 슬롯머신</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at top,#383e72,#12131f 70%);font-family:system-ui,"Noto Sans KR",sans-serif;color:#fff}.machine{width:min(94vw,720px);padding:30px;border-radius:28px;background:linear-gradient(145deg,#292d50,#171927);box-shadow:0 25px 70px #0008}h1{margin:0 0 7px;text-align:center;font-size:30px}.sub{text-align:center;color:#b9bdd8;margin-bottom:22px}.slot{position:relative;height:174px;overflow:hidden;border-radius:18px;background:#080912;border:3px solid #6269b0;box-shadow:inset 0 0 30px #000,0 0 25px #5962c044}.slot:before,.slot:after{content:"";position:absolute;left:0;right:0;height:50px;z-index:3;pointer-events:none}.slot:before{top:0;background:linear-gradient(#080912,transparent)}.slot:after{bottom:0;background:linear-gradient(transparent,#080912)}.center-line{position:absolute;left:10px;right:10px;top:50%;height:58px;transform:translateY(-50%);border-top:2px solid #ffffff44;border-bottom:2px solid #ffffff44;background:#ffffff08;z-index:2;pointer-events:none}.reel{position:absolute;left:0;right:0;top:0;will-change:transform}.reel-item{height:58px;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:clamp(23px,6vw,42px);font-weight:800;word-break:keep-all;text-align:center;color:#9ba0c4;filter:blur(.4px)}.reel-item.active{color:#fff;filter:none;text-shadow:0 0 16px #8e96ff88}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;color:#fff;background:#636bd0}button:disabled{opacity:.5}.spin{display:block;margin:16px auto 10px;border-radius:999px;padding:15px 42px;font-size:20px;background:linear-gradient(135deg,#777fff,#a35cff)}.speed-wrap{text-align:center;margin:14px 0 4px}.speed-label{font-size:13px;color:#b9bdd8;margin-bottom:8px}.speed-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.speed-btn{min-width:72px;background:#30345a;border:1px solid #ffffff22}.speed-btn.selected{background:#7b70e8;box-shadow:0 0 0 2px #ffffff22 inset}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.control-btn{padding:8px 12px;font-size:13px;background:#30345a;border:1px solid #ffffff22}.panel{margin-top:22px;padding:18px;border-radius:18px;background:#0e1020aa;border:1px solid #fff2}.panel h2{font-size:18px;margin:0 0 12px}.add{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px 14px;border:1px solid #555b86;border-radius:10px;background:#080912;color:#fff;font-size:16px}textarea{width:100%;height:75px;resize:vertical;margin-top:10px;padding:12px;border:1px solid #555b86;border-radius:10px;background:#080912;color:#fff;font-size:15px}.small{font-size:13px;color:#aeb2ce;margin-top:8px}.list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;max-height:180px;overflow:auto}.tag{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#30345a;font-size:14px}.tag.won{opacity:.48;text-decoration:line-through}.x{padding:2px 7px;border-radius:50%;background:#555b82;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.result{text-align:center;min-height:24px;color:#d8d9f0}.history{margin-top:16px;padding:14px;border-radius:14px;background:#090b18aa;border:1px solid #ffffff16}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history-title{font-size:14px;font-weight:800}.history-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.history-chip{padding:6px 9px;border-radius:999px;background:#34385f;font-size:13px}.empty-history{font-size:13px;color:#8f94b7}.stepflash{animation:stepflash .28s ease}@keyframes stepflash{0%{box-shadow:inset 0 0 30px #000,0 0 25px #5962c044}45%{box-shadow:inset 0 0 26px #756fff33,0 0 15px #9c84ff66;border-color:#8d91db}100%{box-shadow:inset 0 0 30px #000,0 0 25px #5962c044}}.winflash{animation:flash .7s ease}@keyframes flash{0%{box-shadow:inset 0 0 30px #000,0 0 10px #5962c044}45%{box-shadow:inset 0 0 30px #000,0 0 38px #9c84ffcc}100%{box-shadow:inset 0 0 30px #000,0 0 25px #5962c044}}.winner-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#070812d9;backdrop-filter:blur(7px);z-index:20}.winner-overlay.show{display:flex;animation:fadein .22s ease}.winner-card{width:min(90vw,560px);padding:34px 22px;text-align:center;border-radius:26px;background:linear-gradient(145deg,#303563,#17192b);border:2px solid #8b91ed;box-shadow:0 0 55px #8f76ff66;animation:pop .48s cubic-bezier(.2,.8,.2,1)}.winner-small{font-size:16px;color:#c7caf1}.winner-name{margin:12px 0 20px;font-size:clamp(36px,10vw,70px);line-height:1.12;font-weight:900;word-break:break-word;text-shadow:0 0 24px #9d8cff99}.winner-close{background:#6c72d9}.remaining{text-align:center;font-size:13px;color:#aeb2ce;margin-top:8px}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes pop{0%{transform:scale(.78);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}@media(max-width:520px){.machine{padding:22px 16px}.add{flex-direction:column}.spin{width:100%}}</style></head><body><div class="machine"><h1>🎰 커스텀 랜덤 슬롯머신</h1><div class="sub">이름을 자유롭게 추가·삭제할 수 있습니다.</div><div id="slot" class="slot"><div class="center-line"></div><div id="reel" class="reel"></div></div><div class="remaining" id="remaining"></div><div class="speed-wrap"><div class="speed-label">회전 시간</div><div class="speed-buttons"><button class="speed-btn" data-seconds="5">5s</button><button class="speed-btn selected" data-seconds="10">10s</button><button class="speed-btn" data-seconds="15">15s</button></div></div><div class="controls"><button id="soundBtn" class="control-btn">🔊 소리 켜짐</button><button id="resetWinnersBtn" class="control-btn">↻ 당첨 기록 초기화</button></div><button id="spin" class="spin">🎲 돌리기!</button><div id="result" class="result"></div><div class="history"><div class="history-head"><div class="history-title">🏆 최근 당첨자</div></div><div id="historyList" class="history-list"></div></div><div class="panel"><h2>➕ 이름 추가</h2><div class="add"><input id="nameInput" placeholder="추가할 이름 입력"><button id="addBtn">추가</button></div><textarea id="bulkInput" placeholder="여러 명을 한 번에 추가하려면 이름을 줄바꿈해서 입력하세요."></textarea><div class="actions"><button id="bulkBtn">여러 명 추가</button><button id="resetBtn">명단 비우기</button></div><div id="count" class="small"></div><div id="list" class="list"></div></div></div><div id="winnerOverlay" class="winner-overlay"><div class="winner-card"><div class="winner-small">🎉 당첨자</div><div id="winnerName" class="winner-name"></div><button id="winnerClose" class="winner-close">확인</button></div></div><script>const defaults=[],slot=document.getElementById("slot"),reel=document.getElementById("reel"),spin=document.getElementById("spin"),result=document.getElementById("result"),input=document.getElementById("nameInput"),bulk=document.getElementById("bulkInput"),listEl=document.getElementById("list"),countEl=document.getElementById("count"),historyList=document.getElementById("historyList"),remainingEl=document.getElementById("remaining"),soundBtn=document.getElementById("soundBtn"),resetWinnersBtn=document.getElementById("resetWinnersBtn"),winnerOverlay=document.getElementById("winnerOverlay"),winnerName=document.getElementById("winnerName"),winnerClose=document.getElementById("winnerClose"),speedBtns=[...document.querySelectorAll(".speed-btn")];const saved=localStorage.getItem("slotNames"),savedHistory=localStorage.getItem("slotWinnerHistory");let names=saved===null?[...defaults]:JSON.parse(saved),winnerHistory=savedHistory?JSON.parse(savedHistory):[],currentIndex=0,isSpinning=false,selectedSeconds=10,soundOn=localStorage.getItem("slotSound")!=="off",audioCtx=null;const H=58;function eligibleNames(){const won=new Set(winnerHistory);return names.filter(n=>!won.has(n))}function currentPool(){const p=eligibleNames();return p.length?p:names}function save(){localStorage.setItem("slotNames",JSON.stringify(names));winnerHistory=winnerHistory.filter(n=>names.includes(n));localStorage.setItem("slotWinnerHistory",JSON.stringify(winnerHistory));renderAll();if(!isSpinning)drawIdle()}function renderAll(){countEl.textContent="현재 "+names.length+"명";listEl.innerHTML="";const won=new Set(winnerHistory);names.forEach((n,i)=>{const tag=document.createElement("div");tag.className="tag"+(won.has(n)?" won":"");tag.textContent=n;const x=document.createElement("button");x.className="x";x.textContent="×";x.onclick=()=>{names.splice(i,1);winnerHistory=winnerHistory.filter(w=>w!==n);currentIndex=0;save()};tag.appendChild(x);listEl.appendChild(tag)});historyList.innerHTML="";const recent=winnerHistory.slice(-5).reverse();if(!recent.length){const e=document.createElement("span");e.className="empty-history";e.textContent="아직 당첨자가 없습니다.";historyList.appendChild(e)}else recent.forEach((n,i)=>{const chip=document.createElement("span");chip.className="history-chip";chip.textContent=(winnerHistory.length-i)+". "+n;historyList.appendChild(chip)});const left=eligibleNames().length;remainingEl.textContent=names.length?`중복 제외 · 남은 인원 ${left}명 / 전체 ${names.length}명`:"";soundBtn.textContent=soundOn?"🔊 소리 켜짐":"🔇 소리 꺼짐"}function addName(n){n=n.trim();if(n&&!names.includes(n))names.push(n)}document.getElementById("addBtn").onclick=()=>{addName(input.value);input.value="";save();input.focus()};input.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("addBtn").click()});document.getElementById("bulkBtn").onclick=()=>{bulk.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).forEach(addName);bulk.value="";save()};document.getElementById("resetBtn").onclick=()=>{names=[];winnerHistory=[];currentIndex=0;save();result.textContent=""};resetWinnersBtn.onclick=()=>{if(isSpinning)return;winnerHistory=[];currentIndex=0;localStorage.setItem("slotWinnerHistory","[]");result.textContent="당첨 기록을 초기화했습니다.";renderAll();drawIdle()};speedBtns.forEach(btn=>btn.onclick=()=>{if(isSpinning)return;selectedSeconds=Number(btn.dataset.seconds);speedBtns.forEach(b=>b.classList.toggle("selected",b===btn))});soundBtn.onclick=()=>{soundOn=!soundOn;localStorage.setItem("slotSound",soundOn?"on":"off");renderAll();if(soundOn)tone(520,.05,.025)};function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}function tone(freq,dur=.05,vol=.03,type="sine",delay=0){if(!soundOn)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}function tickSound(progress=.3){tone(340+Math.round(progress*260),.035,.018,"triangle")}function winSound(){tone(523,.16,.045,"sine",0);tone(659,.18,.045,"sine",.12);tone(784,.28,.05,"sine",.25)}function nameAt(i){const p=currentPool();if(!p.length)return "???";return p[(i%p.length+p.length)%p.length]}function makeItem(text,active=false){const d=document.createElement("div");d.className="reel-item"+(active?" active":"");d.textContent=text;return d}function drawIdle(){reel.style.transition="none";reel.style.transform="translateY(0px)";reel.innerHTML="";const p=currentPool();if(!p.length){reel.append(makeItem(""));reel.append(makeItem("???",true));reel.append(makeItem(""));return}currentIndex=((currentIndex%p.length)+p.length)%p.length;reel.append(makeItem(nameAt(currentIndex-1)));reel.append(makeItem(nameAt(currentIndex),true));reel.append(makeItem(nameAt(currentIndex+1)))}function stepOnce(duration,easing="linear",playTick=false,progress=.3){return new Promise(resolve=>{const p=currentPool();if(!p.length){resolve();return}const next=currentIndex+1;reel.innerHTML="";reel.append(makeItem(nameAt(currentIndex-1)));reel.append(makeItem(nameAt(currentIndex),true));reel.append(makeItem(nameAt(next)));reel.append(makeItem(nameAt(next+1)));reel.style.transition="none";reel.style.transform="translateY(0px)";requestAnimationFrame(()=>requestAnimationFrame(()=>{reel.style.transition=`transform ${duration}ms ${easing}`;reel.style.transform=`translateY(-${H}px)`;setTimeout(()=>{currentIndex=next%p.length;drawIdle();if(playTick)tickSound(progress);resolve()},duration+5)}))})}function smallFlash(){slot.classList.remove("stepflash");void slot.offsetWidth;slot.classList.add("stepflash")}function showWinner(name){winnerName.textContent=name;winnerOverlay.classList.add("show")}function hideWinner(){winnerOverlay.classList.remove("show")}winnerClose.onclick=hideWinner;winnerOverlay.onclick=e=>{if(e.target===winnerOverlay)hideWinner()};async function runSpin(){if(!names.length){result.textContent="이름을 한 명 이상 추가해주세요.";return}if(!eligibleNames().length){result.textContent="모든 인원이 이미 당첨되었습니다. 당첨 기록을 초기화해주세요.";return}if(isSpinning)return;initAudio();isSpinning=true;spin.disabled=true;speedBtns.forEach(b=>b.disabled=true);resetWinnersBtn.disabled=true;result.textContent="";slot.classList.remove("winflash","stepflash");const target=selectedSeconds*1000,start=performance.now(),accel=[180,150,125,105,90,78,68,60];for(const d of accel){if(performance.now()-start>=target)break;await stepOnce(d,"cubic-bezier(.32,.01,.66,1)")}let fastCount=0;while(performance.now()-start<target){const d=56+Math.floor(Math.random()*7);await stepOnce(d,"linear",soundOn&&fastCount++%5===0,.2)}const suspense=4+Math.floor(Math.random()*6);for(let i=0;i<suspense;i++){const p=(i+1)/suspense,d=Math.round(125+Math.pow(p,2.35)*850+Math.random()*90);await stepOnce(d,"cubic-bezier(.16,.74,.24,1)",true,p);smallFlash()}slot.classList.remove("stepflash");void slot.offsetWidth;const winner=nameAt(currentIndex);winnerHistory.push(winner);localStorage.setItem("slotWinnerHistory",JSON.stringify(winnerHistory));slot.classList.add("winflash");result.textContent="🎉 당첨자는 「"+winner+"」 입니다!";winSound();renderAll();showWinner(winner);currentIndex=0;spin.disabled=false;speedBtns.forEach(b=>b.disabled=false);resetWinnersBtn.disabled=false;isSpinning=false;setTimeout(()=>{if(winnerOverlay.classList.contains("show"))hideWinner()},3500)}spin.onclick=runSpin;renderAll();drawIdle();</script></body></html>
